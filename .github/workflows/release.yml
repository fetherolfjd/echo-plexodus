name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/src/_version.py)"
          echo "git tag: $tag   app/src/_version.py: $code"
          if [ "$tag" != "$code" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/src/_version.py ($code). Bump _version.py to match the tag."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run tests
        working-directory: app
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Extract this version's changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ ("^## \\[" ver "\\]") { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [$ver]' section found in CHANGELOG.md"
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
