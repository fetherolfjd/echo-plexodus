name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/test.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: app
        run: pytest -v
